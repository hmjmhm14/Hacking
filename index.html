
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Inspector</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: #111827;
    border: 1px solid #263449;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 0 35px #00aaff15;
}

h1 {
    text-align: center;
    color: #38bdf8;
    letter-spacing: 2px;
}

.subtitle {
    text-align: center;
    color: #8492a6;
    margin-bottom: 30px;
}

label {
    display: block;
    margin: 15px 0 8px;
    color: #aab8ca;
}

input {
    width: 100%;
    padding: 14px;
    background: #080f1c;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    outline: none;
}

input:focus {
    border-color: #38bdf8;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #0284c7;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0369a1;
}

#result {
    display: none;
    margin-top: 25px;
    padding: 18px;
    background: #080f1c;
    border: 1px solid #263449;
    border-radius: 10px;
}

.item {
    padding: 10px 0;
    border-bottom: 1px solid #263449;
    overflow-wrap: anywhere;
}

.item:last-child {
    border: none;
}

.item span {
    color: #38bdf8;
}

#error {
    color: #f87171;
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>CYBER INSPECTOR</h1>

<p class="subtitle">IP Information Dashboard</p>

<label>Telegram ID (для вашей записи)</label>
<input id="telegram" placeholder="Например: 123456789">

<label>IP-адрес, предоставленный пользователем</label>
<input id="ip" placeholder="Например: 8.8.8.8">

<button onclick="checkIP()">ПРОВЕРИТЬ IP</button>

<div id="error"></div>

<div id="result">
    <h3 style="color:#38bdf8">Результат проверки</h3>
    <div class="item">Telegram ID: <span id="r_id"></span></div>
    <div class="item">IP: <span id="r_ip"></span></div>
    <div class="item">Страна: <span id="r_country"></span></div>
    <div class="item">Город: <span id="r_city"></span></div>
    <div class="item">Регион: <span id="r_region"></span></div>
    <div class="item">Провайдер: <span id="r_isp"></span></div>
    <div class="item">ASN: <span id="r_asn"></span></div>
</div>

</div>

<script>
async function checkIP() {
    const telegram = document.getElementById("telegram").value.trim();
    const ip = document.getElementById("ip").value.trim();

    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.textContent = "";
    result.style.display = "none";

    if (!ip) {
        error.textContent = "Введите IP-адрес.";
        return;
    }

    try {
        const response = await fetch(
            "https://ipwho.is/" + encodeURIComponent(ip)
        );

        const data = await response.json();

        if (!data.success) {
            error.textContent = "Не удалось проверить IP.";
            return;
        }

        document.getElementById("r_id").textContent =
            telegram || "Не указан";

        document.getElementById("r_ip").textContent =
            data.ip || "—";

        document.getElementById("r_country").textContent =
            data.country || "—";

        document.getElementById("r_city").textContent =
            data.city || "—";

        document.getElementById("r_region").textContent =
            data.region || "—";

        document.getElementById("r_isp").textContent =
            data.connection?.isp || "—";

        document.getElementById("r_asn").textContent =
            data.connection?.asn || "—";

        result.style.display = "block";

    } catch (e) {
        error.textContent = "Ошибка соединения. Попробуйте ещё раз.";
    }
}
</script>

</body>
</html>
